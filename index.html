<style>

-items:center;gap:9px;min-width:0}.taskname{font-weight:650}.grow{flex:1;min-width:0}.truncate{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.shop{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.shopcard{padding:15px;border:1px solid var(--line);border-radius:15px;background:#fffdf8}.shopcard .cost{font-weight:800;color:var(--accent2)}.timeline{display:grid;gap:0}.timeitem{display:grid;grid-template-columns:72px 1fr;gap:12px;padding:10px 0;border-bottom:1px solid var(--line)}.timeitem:last-child{border-bottom:0}.time{color:var(--muted);font-size:12px}.calendar{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}.calhead{font-size:11px;color:var(--muted);text-align:center}.daycell{min-height:75px;border:1px solid var(--line);border-radius:10px;padding:7px;background:#fffdf8}.daycell.today{outline:2px solid var(--accent)}.daynum{font-weight:750}.dot{display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--accent);margin-right:3px}.timer{font-size:58px;font-variant-numeric:tabular-nums;text-align:center;font-weight:850;letter-spacing:.02em}.ring{width:160px;height:160px;border-radius:50%;display:grid;place-items:center;margin:12px auto;background:conic-gradient(var(--accent) var(--deg),#e4ded4 0);position:relative}.ring:after{content:"";width:132px;height:132px;border-radius:50%;background:var(--surface);position:absolute}.ring>*{position:relative;z-index:1}.empty{padding:24px;text-align:center;color:var(--muted);border:1px dashed var(--line);border-radius:14px}.toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:#282620;color:#fff;padding:10px 15px;border-radius:12px;z-index:100;display:none}.modal{position:fixed;inset:0;background:#0007;display:none;align-items:center;justify-content:center;padding:18px;z-index:90}.modal.open{display:flex}.modalbox{width:min(760px,100%);max-height:86vh;overflow:auto;background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:20px;box-shadow:0 30px 80px #0005}.modalhead{display:flex;justify-content:space-between;gap:10px;align-items:center}.palette{display:grid;gap:7px;margin-top:12px}.palette button{text-align:left;border:1px solid var(--line);background:#fffdf8;border-radius:11px;padding:10px}.palette button:hover{background:#eee8dc}.footer{text-align:center;color:var(--muted);font-size:11px;margin-top:30px}.hide{display:none!important}.theme-dark{--bg:#171715;--surface:#23231f;--surface2:#292923;--ink:#f4f0e8;--muted:#aaa69b;--line:#45443c;--accent:#8d9b7c;--accent2:#c29c68;--shadow:0 12px 34px #0008}.theme-dark body{background:#171715}.theme-olive{--accent:#50684c}.theme-blue{--accent:#526d80}.theme-rose{--accent:#916b6b}.compact .card{padding:13px}.compact .grid{gap:9px}.compact .main{padding:18px}.reduce-motion *{transition:none!important;scroll-behavior:auto!important}

<body><div class="app"><aside class="side"><div class="brand">J.A.R.V.I.S. 365<span>PERSONAL OPERATING SYSTEM</span></div><nav id="nav" class="nav"></nav></aside><main class="main"><header class="top"><div><div class="eyebrow">J.A.R.V.I.S. // DAILY CONTROL</div><h1 id="title">Home</h1><div id="date" class="date"></div></div><div class="actions"><button class="btn" data-act="search">⌕ Search</button><button class="btn" data-act="quick">☰ Quick Nav</button><button class="btn" data-act="focus">◷ Focus</button></div></header><div id="appSections"></div><div class="footer">Local-first • automatic daily rollover • export anytime</div></main></div><div id="modal" class="modal"><div id="modalbox" class="modalbox"></div></div><div id="toast" class="toast"></div><input id="restoreFile" type="file" accept="application/json" hidden>
<script>
const KEY='jarvis365_v20';
const DAYS=['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
const NAV=[['home','⌂','Home'],['workout','◈','Workout'],['health','♡','Health'],['tasks','✓','Tasks'],['habits','◆','Habits'],['school','▣','School'],['calendar','▦','Calendar'],['focus','◷','Focus'],['notes','✎','Notes'],['goals','◎','Goals'],['money','€','Money'],['shop','▤','Shop'],['log','☼','Journal'],['analytics','◒','Analytics'],['settings','⚙','Settings']];
const EX=[['Knee push-up','Chest / triceps',3,8,'slow controlled reps'],['Glute bridge','Glutes',3,12,'pause at top'],['Calf raise','Calves',3,15,'full range'],['Dead bug','Core',2,10,'slow alternating'],['Wall sit','Quads',2,20,'seconds'],['Mobility flow','Mobility',1,5,'minutes']];
const ROUTINES={Sunday:['Recovery reset','Mobility','Weekly planning'],Monday:['Upper body','Core','School prep'],Tuesday:['Lower body','Mobility','Study block'],Wednesday:['Upper body','Core','Deep work'],Thursday:['Lower body','Posture','Study block'],Friday:['Full body','Mobility','Weekly review'],Saturday:['Recovery','Stretch','Life admin']};
const FEEL=['Way too easy','Easy','Good','Hard','Very hard','Too hard'];
const THEMES={beige:'',olive:'theme-olive',blue:'theme-blue',rose:'theme-rose',dark:'theme-dark'};
function today(){return new Date().toISOString().slice(0,10)}
function fresh(){return{date:today(),coins:0,xp:0,level:1,toughness:50,water:0,waterGoal:8,sleep:8,steps:0,stepsGoal:7000,mood:3,energy:3,stress:3,focus:0,tasks:[],habits:[],school:[],goals:[],expenses:[],budget:100,rewards:[{id:1,name:'30 min gaming',cost:80,icon:'🎮'},{id:2,name:'Movie night',cost:150,icon:'🎬'},{id:3,name:'€5 fun budget',cost:300,icon:'💶'}],notes:[],logs:[],history:[],calendar:[],workout:{started:false,done:[],feedback:null,duration:0,sets:[]},focusTimer:{minutes:25,seconds:0,running:false,mode:'Focus',sessions:0},settings:{theme:'beige',compact:false,motion:true,weekStart:1,defaultTaskDuration:25,showQuick:true,schoolName:'School',units:'metric'}}}
let state=(()=>{try{return JSON.parse(localStorage.getItem(KEY))||fresh()}catch{return fresh()}})();
let active='home', timerId=null;
function save(){localStorage.setItem(KEY,JSON.stringify(state))}
function ensureDay(){const t=today();if(state.date!==t){state.history.push({date:state.date,water:state.water,sleep:state.sleep,steps:state.steps,mood:state.mood,energy:state.energy,stress:state.stress,tasksDone:state.tasks.filter(x=>x.done).length,workout:{...state.workout}});state.date=t;state.water=0;state.steps=0;state.mood=3;state.energy=3;state.stress=3;state.workout={started:false,done:[],feedback:null,duration:0,sets:[]};state.focusTimer={minutes:25,seconds:0,running:false,mode:'Focus',sessions:state.focusTimer?.sessions||0};save()}}
ensureDay();
function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function toast(s){const t=document.getElementById('toast');t.textContent=s;t.style.display='block';clearTimeout(window.toastT);window.toastT=setTimeout(()=>t.style.display='none',1800)}
function xp(n){state.xp+=n;state.coins+=Math.max(1,Math.ceil(n/5));state.level=1+Math.floor(state.xp/500)}
function pct(a,b){return b?Math.max(0,Math.min(100,Math.round(a/b*100))):0}
function setTheme(){document.documentElement.className=(THEMES[state.settings.theme]||'')+(state.settings.compact?' compact':'')+(!state.settings.motion?' reduce-motion':'')}
function nav(){document.getElementById('nav').innerHTML=NAV.map(([id,ic,l],i)=>`<button class="${active===id?'active':''}" data-nav="${id}"><span>${ic} ${l}</span><kbd>${i<9?i+1:''}</kbd></button>`).join('')}
function go(id){active=id;nav();document.querySelectorAll('.section').forEach(s=>s.classList.remove('active'));const s=document.getElementById('s-'+id);if(s)s.classList.add('active');document.getElementById('title').textContent=NAV.find(x=>x[0]===id)?.[2]||id;renderAll();window.scrollTo({top:0,behavior:state.settings.motion?'smooth':'auto'})}
function shell(){document.getElementById('appSections').innerHTML=NAV.map(([id])=>`<section id="s-${id}" class="section"></section>`).join('')}
function card(content,cls=''){return `<div class="card ${cls}">${content}</div>`}
function kpi(label,val,sub=''){return `<div class="kpi"><div class="muted small">${label}</div><strong>${val}</strong><div class="muted tiny">${sub}</div></div>`}
function header(label,title,desc=''){return `<div class="eyebrow">${label}</div><h2>${title}</h2>${desc?`<p class="muted">${desc}</p>`:''}`}
function home(){const d=DAYS[new Date().getDay()],r=ROUTINES[d];const done=state.tasks.filter(x=>x.done).length;const habits=state.habits.filter(x=>x.done).length;const upcoming=[...state.tasks.filter(x=>!x.done),...state.school.filter(x=>!x.done)].slice(0,5);document.getElementById('s-home').innerHTML=`<div class="grid">${card(`${header('TODAY','Your control center',`${d} • ${state.date}`)}<div class="kpis">${kpi('Daily completion',pct(done,state.tasks.length||1)+'%',done+' tasks done')}${kpi('Coins',state.coins,'Level '+state.level)}${kpi('Workout toughness',state.toughness+'%','Adaptive target')}${kpi('Focus',state.focus+' min',state.focusTimer.sessions+' sessions')}</div><div class="bar" style="margin:14px 0"><div class="fill" style="width:${pct(done,state.tasks.length||1)}%"></div></div><div class="actions"><button class="btn primary" data-nav="workout">Start workout</button><button class="btn" data-nav="tasks">Open tasks</button><button class="btn" data-nav="focus">Start focus</button><button class="btn" data-nav="calendar">View calendar</button></div>`,'wide hero')}${card(`${header('TODAY','Routine') }<div class="list">${r.map((x,i)=>`<div class="row"><span><span class="chip">${i+1}</span> ${x}</span><span class="muted small">${i===0?'Now':'Later'}</span></div>`).join('')}</div>`)}${card(`${header('HEALTH','Snapshot')}<div class="kpis">${kpi('Sleep',state.sleep+'h','target 8h')}${kpi('Water',state.water+'/'+state.waterGoal,'glasses')}${kpi('Steps',state.steps.toLocaleString(),'/ '+state.stepsGoal)}${kpi('Mood',state.mood+'/5','today')}</div><button class="btn" style="margin-top:10px" data-nav="health">Open health</button>`)}${card(`${header('UP NEXT','Important items')}${upcoming.length?`<div class="list">${upcoming.map(x=>`<div class="row"><span class="grow truncate">${esc(x.name)}</span><span class="chip">${x.priority||'Normal'}</span></div>`).join('')}</div>`:'<div class="empty">Nothing urgent. Suspiciously peaceful.</div>'}`,'wide')}${card(`${header('HABITS','Today')}${state.habits.length?`<div class="list">${state.habits.slice(0,5).map((h,i)=>`<label class="row"><span>${esc(h.name)}</span><input class="check" type="checkbox" data-habit="${i}" ${h.done?'checked':''}></label>`).join('')}</div>`:'<div class="empty">Create a few habits you actually want.</div>'}<button class="btn" style="margin-top:10px" data-nav="habits">Manage habits</button>`)}${card(`${header('J.A.R.V.I.S.','Quick actions')}<div class="actions"><button class="btn" data-act="quick">Quick Nav</button><button class="btn" data-act="search">Search</button><button class="btn" data-act="backup">Backup</button><button class="btn" data-act="note">Quick note</button></div>`,'full')}</div>`}
function workout(){const done=state.workout.done.length,total=EX.length;const top=card(`${header('TRAINING','Adaptive workout',DAYS[new Date().getDay()]+' • toughness '+state.toughness+'%')}<div class="kpis">${kpi('Exercises',done+'/'+total,'completed')}${kpi('Toughness',state.toughness+'%','adaptive')}${kpi('Feedback',state.workout.feedback==null?'Pending':FEEL[state.workout.feedback],'after session')}${kpi('XP',done*20,'earned today')}</div><div class="bar" style="margin:14px 0"><div class="fill" style="width:${pct(done,total)}%"></div></div><div class="actions"><button class="btn primary" data-act="startWorkout">${state.workout.started?'Workout active':'Start workout'}</button><button class="btn" data-act="toughDown">− easier</button><button class="btn" data-act="toughUp">+ harder</button><button class="btn" data-act="workoutReset">Reset session</button></div>`,'wide hero');const session=card(`${header('SESSION','How it works','Tap an exercise to mark it complete. Your feedback adjusts the next session.')}<div class="list">${EX.map((e,i)=>`<div class="row"><div class="taskmain"><input class="check" type="checkbox" data-ex="${i}" ${state.workout.done.includes(i)?'checked':''}><div class="grow"><div class="taskname">${e[0]}</div><div class="muted small">${e[1]} • ${e[2]} sets × ${e[3]} • ${e[4]}</div></div></div><span class="chip">${Math.round(+e[2]*(1+state.toughness/200))} sets</span></div>`).join('')}</div>`,'wide');const feedback=state.workout.done.length===EX.length?`<div class="shop">${FEEL.map((x,i)=>`<button class="shopcard btn ${state.workout.feedback===i?'primary':''}" data-feedback="${i}"><strong>${x}</strong><div class="muted small">${[-5,-2,0,2,4,6][i]} toughness</div></button>`).join('')}</div>`:'<div class="empty">Finish every exercise to unlock feedback.</div>';const after=card(`${header('AFTER SESSION','How did it feel?')}${feedback}`,'half');const progress=card(`${header('PROGRESS','Training notes')}<div class="kpis">${kpi('Sessions',state.history.filter(x=>x.workout?.done?.length).length,'logged')}${kpi('Current load',state.toughness+'%','adaptive')}${kpi('Best feedback',state.history.length?Math.max(...state.history.map(x=>x.workout?.feedback??-1))+1:0,'rating')}${kpi('Recovery',state.sleep>=7?'Good':'Low','based on sleep')}</div>`,'half');document.getElementById('s-workout').innerHTML=`<div class="grid">${top}${session}${after}${progress}</div>`}
function health(){const waterPct=pct(state.water,state.waterGoal),stepPct=pct(state.steps,state.stepsGoal);document.getElementById('s-health').innerHTML=`<div class="grid">${card(`${header('HEALTH','Daily health dashboard','Track the basics without pretending your browser is a medical device.') }<div class="kpis">${kpi('Sleep',state.sleep+'h','target '+state.settings.bed)}${kpi('Water',state.water+'/'+state.waterGoal,'glasses')}${kpi('Steps',state.steps.toLocaleString(),'/ '+state.stepsGoal)}${kpi('Mood',state.mood+'/5','today')}</div>`,'wide hero')}${card(`${header('HYDRATION','Water') }<div class="metric">${state.water}<span class="muted small"> / ${state.waterGoal}</span></div><div class="bar"><div class="fill" style="width:${waterPct}%"></div></div><div class="actions" style="margin-top:10px"><button class="btn primary" data-act="water">+ 1 glass</button><button class="btn" data-act="waterMinus">− 1</button></div>`)}${card(`${header('MOVEMENT','Steps')}<div class="metric">${state.steps.toLocaleString()}</div><div class="bar"><div class="fill" style="width:${stepPct}%"></div></div><div class="actions" style="margin-top:10px"><button class="btn" data-act="steps" data-n="500">+500</button><button class="btn" data-act="steps" data-n="1000">+1k</button><button class="btn" data-act="stepsMinus">−500</button></div>`)}${card(`${header('SLEEP','Recovery') }<div class="metric">${state.sleep}h</div><div class="actions"><button class="btn" data-act="sleepMinus">− 30m</button><button class="btn" data-act="sleepPlus">+ 30m</button></div><p class="muted small">Bed ${state.settings.bed} • Wake ${state.settings.morning}</p>`)}${card(`${header('BODY SIGNALS','Mood / energy / stress')}<div class="list"><div class="row"><span>Mood</span><div class="actions">${[1,2,3,4,5].map(n=>`<button class="btn sm ${state.mood===n?'primary':''}" data-mood="${n}">${n}</button>`).join('')}</div></div><div class="row"><span>Energy</span><div class="actions">${[1,2,3,4,5].map(n=>`<button class="btn if(a==='addTask'){const n=document.getElementById('taskName').value.trim();if(!n)return toast('Enter a task');state.tasks.push({name:n,priority:document.getElementById('taskPriority').value,category:document.getElementById('taskCat').value,due:document.getElementById('taskDue').value,minutes:+document.getElementById('taskMinutes').value||state.settings.defaultTaskDuration,done:false});xp(5);save();renderAll();toast('Task added');return}
if(a==='startWorkout'){state.workout.started=true;save();renderAll();toast('Workout started');return}if(a==='toughUp'){state.toughness=Math.min(95,state.toughness+3);save();renderAll();return}if(a==='toughDown'){state.toughness=Math.max(20,state.toughness-3);save();renderAll();return}if(a==='workoutReset'){state.workout={started:false,done:[],feedback:null,duration:0,sets:[]};save();renderAll();return}if(a==='water'){state.water=Math.min(state.waterGoal,state.water+1);xp(2);save();renderAll();return}if(a==='waterMinus'){state.water=Math.max(0,state.water-1);save();renderAll();return}if(a==='steps'){state.steps+=+e.dataset.n;xp(1);save();renderAll();return}if(a==='stepsMinus'){state.steps=Math.max(0,state.steps-500);save();renderAll();return}if(a==='sleepPlus'){state.sleep=Math.min(12,+(state.sleep+.5).toFixed(1));save();renderAll();return}if(a==='sleepMinus'){state.sleep=Math.max(0,+(state.sleep-.5).toFixed(1));save();renderAll();return}if(a==='healthGoals'){state.waterGoal=Math.max(1,+document.getElementById('waterGoal').value||8);state.stepsGoal=Math.max(100,+document.getElementById('stepsGoal').value||7000);save();renderAll();toast('Health targets saved');return}if(a==='addHabit'){const n=document.getElementById('habitName').value.trim();if(!n)return toast('Enter a habit');state.habits.push({name:n,type:document.getElementById('habitType').value,target:+document.getElementById('habitTarget').value||1,done:false});xp(3);save();renderAll();return}if(a==='addSchool'){const s=document.getElementById('subject').value.trim(),n=document.getElementById('schoolName').value.trim();if(!s||!n)return toast('Fill subject and assignment');state.school.push({subject:s,name:n,due:document.getElementById('schoolDue').value,grade:document.getElementById('schoolGrade').value,done:false});xp(5);save();renderAll();return}if(a==='addEvent'){const n=document.getElementById('eventName').value.trim();if(!n)return toast('Enter an event');state.calendar.push({name:n,date:document.getElementById('eventDate').value,time:document.getElementById('eventTime').value});save();renderAll();toast('Event added');return}if(a==='timerToggle'){state.focusTimer.running=!state.focusTimer.running;save();runTimer();renderAll();return}if(a==='timerReset'){state.focusTimer.running=false;state.focusTimer.seconds=0;state.focusTimer.minutes=state.focusTimer.mode==='Focus'?25:5;save();runTimer();renderAll();return}if(a==='timerSwitch'){state.focusTimer.running=false;state.focusTimer.mode=state.focusTimer.mode==='Focus'?'Break':'Focus';state.focusTimer.minutes=state.focusTimer.mode==='Focus'?25:5;state.focusTimer.seconds=0;save();renderAll();return}if(a==='focusSet'){state.focusTimer.minutes=Math.max(1,+document.getElementById('focusMin').value||25);state.focusTimer.seconds=0;state.focusTimer.running=false;save();renderAll();return}if(a==='addNote'){const t=document.getElementById('noteTitle').value.trim()||'Untitled',b=document.getElementById('noteBody').value;state.notes.push({title:t,body:b,date:state.date});xp(3);save();renderAll();return}if(a==='addGoal'){const n=document.getElementById('goalName').value.trim(),t=+document.getElementById('goalTarget').value;if(!n||!t)return toast('Add goal and target');state.goals.push({name:n,target:t,progress:0,unit:document.getElementById('goalUnit').value});save();renderAll();return}if(a==='addExpense'){const n=document.getElementById('expenseName').value.trim(),v=+document.getElementById('expenseAmount').value;if(!n||!v)return toast('Enter expense');state.expenses.push({name:n,amount:v,cat:document.getElementById('expenseCat').value,date:state.date});save();renderAll();return}if(a==='saveBudget'){state.budget=Math.max(0,+document.getElementById('budget').value||0);save();renderAll();return}if(a==='addReward'){const n=document.getElementById('rewardName').value.trim(),c=+document.getElementById('rewardCost').value;if(!n||!c)return toast('Enter reward');state.rewards.push({id:Date.now(),name:n,cost:c,icon:document.getElementById('rewardIcon').value||'★'});save();renderAll();return}if(a==='saveLog'){state.logs.push({date:state.date,win:document.getElementById('win').value,challenge:document.getElementById('challenge').value,lesson:document.getElementById('lesson').value,tomorrow:document.getElementById('tomorrow').value});xp(10);save();renderAll();toast('Reflection saved');return}if(a==='saveSettings'){state.settings.theme=document.getElementById('theme').value;state.settings.morning=document.getElementById('wake').value;state.settings.bed=document.getElementById('bed').value;state.settings.defaultTaskDuration=Math.max(1,+document.getElementById('defaultMinutes').value||25);state.settings.compact=document.getElementById('compact').value==='1';state.settings.motion=document.getElementById('motion').checked;state.settings.showQuick=document.getElementById('showQuick').checked;state.settings.weekStart=document.getElementById('weekStart').checked?1:0;save();renderAll();toast('Settings saved');return}if(a==='reset')return reset()}
function runTimer(){clearInterval(timerId);if(!state.focusTimer.running)return;timerId=setInterval(()=>{if(!state.focusTimer.running)return;let f=state.focusTimer;if(f.seconds>0)f.seconds--;else if(f.minutes>0){f.minutes--;f.seconds=59}else{f.running=false;if(f.mode==='Focus'){f.sessions++;state.focus+=25;xp(20);toast('Focus session complete');}f.mode=f.mode==='Focus'?'Break':'Focus';f.minutes=f.mode==='Focus'?25:5;f.seconds=0;save()}save();if(active==='focus')focus()},1000)}
document.addEventListener('click',ev=>{const n=ev.target.closest('[data-nav]');if(n){ev.preventDefault();document.getElementById('modal').classList.remove('open');go(n.dataset.nav);return}const q=ev.target.closest('[data-quick-nav]');if(q){document.getElementById('modal').classList.remove('open');go(q.dataset.quickNav);return}const sn=ev.target.closest('[data-search-nav]');if(sn){document.getElementById('modal').classList.remove('open');go(sn.dataset.searchNav);return}const a=ev.target.closest('[data-act]');if(a){ev.preventDefault();act(a.dataset.act,a);return}const t=ev.target.closest('[data-task]');if(t){const i=+t.dataset.task;state.tasks[i].done=t.checked;if(t.checked)xp(15);save();renderAll();return}const ex=ev.target.closest('[data-ex]');if(ex){if(!state.workout.started){toast('Start the workout first');return}const i=+ex.dataset.ex;const d=state.workout.done;if(d.includes(i))d.splice(d.indexOf(i),1);else{d.push(i);xp(20)}save();renderAll();return}const fb=ev.target.closest('[data-feedback]');if(fb){state.workout.feedback=+fb.dataset.feedback;const delta=[-5,-2,0,2,4,6][+fb.dataset.feedback];state.toughness=Math.max(20,Math.min(95,state.toughness+delta));state.workout.started=false;save();renderAll();toast('Feedback saved and next session adjusted');return}const h=ev.target.closest('[data-habit]');if(h){const i=+h.dataset.habit;state.habits[i].done=h.checked;if(h.checked)xp(10);save();renderAll();return}const th=ev.target.closest('[data-toggle-habit]');if(th){const i=+th.dataset.toggleHabit;state.habits[i].done=!state.habits[i].done;if(state.habits[i].done)xp(10);save();renderAll();return}const sh=ev.target.closest('[data-school-done]');if(sh){state.school[+sh.dataset.schoolDone].done=!state.school[+sh.dataset.schoolDone].done;save();renderAll();return}const gp=ev.target.closest('[data-goal-plus]');if(gp){const i=+gp.dataset.goalPlus;state.goals[i].progress=Math.min(state.goals[i].target,state.goals[i].progress+1);xp(5);save();renderAll();return}const gm=ev.target.closest('[data-goal-minus]');if(gm){const i=+gm.dataset.goalMinus;state.goals[i].progress=Math.max(0,state.goals[i].progress-1);save();renderAll();return}const buy=ev.target.closest('[data-buy]');if(buy){const r=state.rewards.find(x=>x.id==buy.dataset.buy);if(!r||state.coins<r.cost){toast('Not enough coins');return}state.coins-=r.cost;save();renderAll();toast('Reward redeemed');return}const del=[['data-delete-task','tasks'],['data-delete-habit','habits'],['data-delete-school','school'],['data-delete-note','notes'],['data-delete-goal','goals'],['data-delete-expense','expenses']];for(const [attr,key] of del){const x=ev.target.closest('['+attr+']');if(x){state[key].splice(+x.getAttribute(attr),1);save();renderAll();return}}const idea=ev.target.closest('[data-add-idea]');if(idea){state.habits.push({name:idea.dataset.addIdea,type:'Checkbox',target:1,done:false});save();renderAll();return}const ni=ev.target.closest('[data-note-idea]');if(ni){go('notes');setTimeout(()=>{document.getElementById('noteTitle').value=ni.dataset.noteIdea},0);return}if(ev.target.id==='modal')ev.target.classList.remove('open')});
document.addEventListener('keydown',e=>{if(e.key>='1'&&e.key<='9'&&!['INPUT','TEXTAREA','SELECT'].includes(document.activeElement.tagName)){const n=NAV[+e.key-1];if(n)go(n[0]);}if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='k'){e.preventDefault();search()}});
document.getElementById('restoreFile').addEventListener('change',e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{const x=JSON.parse(r.result);if(!x.date||!x.tasks)throw Error();state=x;save();renderAll();toast('Backup restored')}catch{toast('Invalid backup')}};r.readAsText(f);e.target.value=''})
shell();nav();go(active);runTimer();if('serviceWorker' in navigator)navigator.serviceWorker.register('./sw.js').catch(()=>{});
</script></body></html>
